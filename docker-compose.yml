services:
  twitch-drops-miner:
    image: ghcr.io/loginrs99/tdm:latest
    pull_policy: always
    container_name: twitch-drops-miner
    restart: unless-stopped
    init: true
    environment:
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - DISCORD_SUMMARY_INTERVAL=${DISCORD_SUMMARY_INTERVAL:-240}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_OWNER_ID=${DISCORD_OWNER_ID:-}
      - PRIORITY_MODE=${PRIORITY_MODE:-BALANCED}
      - LOGGING_LEVEL=${LOGGING_LEVEL:-INFO}
      - MAINTENANCE_INTERVAL_MINUTES=${MAINTENANCE_INTERVAL_MINUTES:-20}
      - AUTO_COOKIE_REFRESH=${AUTO_COOKIE_REFRESH:-true}
      - TWITCH_USERNAME=${TWITCH_USERNAME:-}
      - TWITCH_PASSWORD=${TWITCH_PASSWORD:-}
      - WEB_DASHBOARD=${WEB_DASHBOARD:-true}
      - WEB_PORT=${WEB_PORT:-8080}
      - WEB_PASSWORD=${WEB_PASSWORD:-}
      - PYTHONUNBUFFERED=1
      - TZ=${TZ:-UTC}

    stop_grace_period: 30s
    security_opt:
      - "no-new-privileges:true"

    deploy:
      resources:
        limits:
          memory: 1G

    ports:
      - "8080:8080"
    
    volumes:
      # These two files must exist on the host before first start.
      # Docker creates a directory when a bind-mounted file source is missing.
      - ./files/settings.json:/home/appuser/app/settings.json:ro
      # Login: export Twitch browser cookies in Netscape format to ./files/cookies.jar.
      # Keep this file private and out of git; replace it and restart if Twitch logs out.
      - ./files/cookies.jar:/home/appuser/app/cookies.jar
      - ./files/logs:/home/appuser/app/logs
      - ./files/browser_profile:/home/appuser/app/files/browser_profile
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 50M

    sysctls:
      net.ipv4.tcp_keepalive_time: 60
      net.ipv4.tcp_keepalive_intvl: 10
      net.ipv4.tcp_keepalive_probes: 5
      
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
